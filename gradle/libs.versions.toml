[versions]
# Build
androidGradlePlugin = "8.13.0"
kotlin = "2.2.10"

# AndroidX / Compose
androidxActivity = "1.10.1"
androidxCompose = "1.9.0"
androidxLifecycle = "2.9.3"
lifecycleRuntimeCompose = "2.9.3"
lifecycleProcess = "2.9.3"
composeBom = "2025.08.01"
material3 = "1.3.2"
coreKtx = "1.13.1"
appcompat = "1.7.0"

# Kotlin libs
# stdlib 은 컴파일러(2.2.10)가 아니라 **소비처 하한**에 맞춘다 — estloginkit/build.gradle.kts 주석 참고.
kotlinStdlib = "2.0.21"
coroutine = "1.10.2"
# 1.9.0 은 메타데이터 mv=[2,2,0] 이라 Kotlin 2.0.x 소비 앱에서 거부된다. 1.8.1 은 mv=[2,1,0] 로 통과.
kotlinxSerializationJson = "1.8.1"

# Network
# retrofit 3.x 는 okhttp 5.x 를 요구하고, okhttp 5.1.0 은 mv=[2,2,0] 이라 Kotlin 2.0.x 소비 앱을
# 깨뜨린다. okhttp 4.12 는 카카오(4.9.2)·네이버(4.2.1) SDK 가 기대하는 라인과도 정합적이다.
retrofit2 = "2.11.0"
okhttp3LoggingInterceptor = "4.12.0"
retrofitKotlinxSerializationJson = "1.0.0"

# Social
kakaoSdk = "2.23.2"
naverIdLogin = "5.11.2"

# Logger
orhanobutLogger = "2.2.0"

# Test
kotlinTest = "1.8.22"

[libraries]
# Kotlin
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlinStdlib" }
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutine" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutine" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }

# AndroidX
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-viewModelCompose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycleRuntimeCompose" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycleProcess" }

# Compose
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "androidxCompose" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime", version.ref = "androidxCompose" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "androidxCompose" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "androidxCompose" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "androidxCompose" }

# Network
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit2" }
retrofit-converter-scalars = { group = "com.squareup.retrofit2", name = "converter-scalars", version.ref = "retrofit2" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp3LoggingInterceptor" }
retrofit-kotlin-serialization = { group = "com.jakewharton.retrofit", name = "retrofit2-kotlinx-serialization-converter", version.ref = "retrofitKotlinxSerializationJson" }

# Social
kakao-user = { module = "com.kakao.sdk:v2-user", version.ref = "kakaoSdk" }
naver-id-login = { module = "com.navercorp.nid:oauth", version.ref = "naverIdLogin" }

# Logger
orhanobut-logger = { group = "com.orhanobut", name = "logger", version.ref = "orhanobutLogger" }

# Test
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlinTest" }
kotlin-test-junit = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit", version.ref = "kotlinTest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
android-library = { id = "com.android.library", version.ref = "androidGradlePlugin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
